name: Docker Image Info

on:
  push:
    branches:
      - main
    paths-ignore:
      - kube-images.txt

permissions:
  contents: write

jobs:
  docker-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t accounts:latest .

      - name: Capture Docker image details
        run: |
          {
            echo "REPOSITORY   TAG       IMAGE ID       CREATED          SIZE"
            docker images accounts --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}'
            echo
            docker image inspect accounts:latest --format 'Name: {{index .RepoTags 0}}'
            docker image inspect accounts:latest --format 'Image ID: {{.Id}}'
            docker image inspect accounts:latest --format 'Created: {{.Created}}'
            docker image inspect accounts:latest --format 'Size: {{.Size}} bytes'
          } | tee kube-images.txt

      - name: Commit Docker image details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kube-images.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add Docker image details output"
          git push
